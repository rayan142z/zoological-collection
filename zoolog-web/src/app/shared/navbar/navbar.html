<!-- AS: Diese Datei definiert die Navigationsleiste (Navbar) der Webseite. Sie enthält den Titel der Sammlung und Links zu verschiedenen Seiten wie Übersicht, Kartenansicht und Artenanträge. -->

<nav class="navbar">
  <div class="navbar-left">
    <div class="logo-box">🌿</div>
    <span class="brand-name">Zoologische Sammlung</span>
  </div>

  <div class="navbar-center">
    <a class="nav-link active" href="#">Übersicht</a>
    <a class="nav-link" href="#">Objekte</a>
    <a class="nav-link" href="#">Neues Objekt</a>
    <a class="nav-link" href="#">Über uns</a>
  </div>

  <div class="navbar-right">
    <span class="login-icon">♙</span>

    @if (currentUser(); as user) {
      <a class="login-link" routerLink="/profile">
        {{ user.username || user.email }}
      </a>

      <button class="logout-button" type="button" (click)="logout()">
        Abmelden
      </button>
    } @else {
      <a class="login-link" routerLink="/login">Login</a>
      <a class="login-link" routerLink="/register">Registrieren</a>
    }
  </div>
</nav>
