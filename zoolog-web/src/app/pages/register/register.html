<div class="auth-page">
    <section class="auth-card">
        <h1>Registrieren</h1>

        <form (ngSubmit)="onSubmit()" class="auth-form">
            <div class="form-group">
                <label for="username">Benutzername</label>
                <input
                    id="username"
                    name="username"
                    type="text"
                    [(ngModel)]="username"
                >
            </div>

            <div class="form-group">
                <label for="email">E-Mail</label>
                <input
                    id="email"
                    name="email"
                    type="email"
                    [(ngModel)]="email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Passwort</label>
                <input
                    id="password"
                    name="password"
                    type="password"
                    [(ngModel)]="password"
                    required
                >
            </div>

            @if (errorMessage) {
                <p class="error-message">{{ errorMessage }}</p>
            }

            <button class="primary-button" type="submit">Registrieren</button>
        </form>

        <p class="auth-footer">
            Schon ein Konto?
            <a routerLink="/login">Zum Login</a>
        </p>
    </section>
</div>
