<h1>Registrieren</h1>

<form (ngSubmit)="onSubmit()">
    <div>
        <label for="username">Benutzername</label>
        <input
            id="username"
            name="username"
            type="text"
            [(ngModel)]="username"
        >
    </div>

    <div>
        <label for="email">E-Mail</label>
        <input
            id="email"
            name="email"
            type="email"
            [(ngModel)]="email"
            required
        >
    </div>

    <div>
        <label for="password">Passwort</label>
        <input
            id="password"
            name="password"
            type="password"
            [(ngModel)]="password"
            required
        >
    </div>

    @if (errorMessage) {
        <p>{{ errorMessage }}</p>
    }

    <button type="submit">Registrieren</button>
</form>

<p>
    Schon ein Konto?
    <a routerLink="/login">Zum Login</a>
</p>
