<h1>Profil</h1>

@if (currentUser(); as user) {
    <div>
        <p><strong>Benutzername:</strong> {{ user.username || 'Kein Benutzername vorhanden' }}</p>
        <p><strong>E-Mail:</strong> {{ user.email }}</p>
        <p><strong>Rolle:</strong> {{ user.role }}</p>

        <button type="button" (click)="logout()">Abmelden</button>
    </div>
} @else {
    <p>Du bist aktuell nicht eingeloggt.</p>
    <a routerLink="/login">Zum Login</a>
}
