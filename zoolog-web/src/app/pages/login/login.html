<h1>Login</h1>

<form (ngSubmit)="onSubmit()">
    <div>
        <label for="email">E-Mail</label>
        <input
            id="email"
            name="email"
            type="email"
            [(ngModel)]="email"
            required
        >
    </div>

    <div>
        <label for="password">Passwort</label>
        <input
            id="password"
            name="password"
            type="password"
            [(ngModel)]="password"
            required
        >
    </div>

    @if (errorMessage) {
        <p>{{ errorMessage }}</p>
    }

    <button type="submit">Einloggen</button>
</form>

<p>
    Noch kein Konto?
    <a routerLink="/register">Registrieren</a>
</p>
