<div class="auth-page">
    <section class="auth-card">
        <h1>Login</h1>

        <form (ngSubmit)="onSubmit()" class="auth-form">
            <div class="form-group">
                <label for="email">E-Mail</label>
                <input
                    id="email"
                    name="email"
                    type="email"
                    [(ngModel)]="email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Passwort</label>
                <input
                    id="password"
                    name="password"
                    type="password"
                    [(ngModel)]="password"
                    required
                >
            </div>

            @if (errorMessage) {
                <p class="error-message">{{ errorMessage }}</p>
            }

            <button class="primary-button" type="submit">Einloggen</button>
        </form>

        <p class="auth-footer">
            Noch kein Konto?
            <a routerLink="/register">Registrieren</a>
        </p>
    </section>
</div>
