# Builds the frontend in demo mode (sample data, no backend) and publishes it to GitHub Pages.
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['zoolog-web/**', '.github/workflows/deploy-demo.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zoolog-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: zoolog-web/package-lock.json

      - run: npm ci

      - name: Build demo
        run: npx ng build --configuration demo --base-href "/${{ github.event.repository.name }}/"

      # GitHub Pages has no SPA routing: serve the app for unknown paths too
      - run: cp dist/zoolog-web/browser/index.html dist/zoolog-web/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: zoolog-web/dist/zoolog-web/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
